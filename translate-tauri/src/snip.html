<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chụp vùng màn hình</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
      font-family: "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hint-pill {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 99px;
      background: rgba(13, 15, 20, 0.88);
      border: 1px solid rgba(59, 130, 246, 0.55);
      color: #eef0f6;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      z-index: 10;
    }
    .size-badge {
      position: fixed;
      padding: 3px 8px;
      border-radius: 5px;
      background: #2563eb;
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      pointer-events: none;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="hint-pill" id="hintPill">
    Kéo thả chuột chọn vùng màn hình cần dịch • Nhấn Esc hoặc chuột phải để hủy
  </div>
  <div class="size-badge" id="sizeBadge">0 × 0</div>
  <canvas id="snipCanvas"></canvas>

  <script type="module" src="snip.js"></script>
</body>
</html>
