name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './translate-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd translate-tauri
          npm install

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: './translate-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'Quick Translate ${{ github.ref_name }}'
          releaseBody: 'Xem chi tiết các thay đổi trong phiên bản ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
